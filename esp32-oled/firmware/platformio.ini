; ESP32 + SSD1306 OLED (128x64, I2C)
;
; Stage 1: Arduino framework + Adafruit SSD1306 library (this file).
; Stage 2 (later): replace the library with our own SSD1306 driver in C.
;
;   pio run -t upload                 flash the OLED demo   (env: oled_sh1106, our 1.3" SH1106 module)
;   pio run -e oled -t upload         same demo for SSD1306 modules
;   pio run -e scanner -t upload      flash the I2C bus scanner (env: scanner, tools/i2c_bus_scanner.cpp)
;   pio device monitor                open the serial monitor

[platformio]
default_envs = oled_sh1106

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:oled]
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1

; Diagnostic tool, kept outside src/ because it has its own setup()/loop().
; -<*> drops everything in src/, then the tool file is added back in.
[env:scanner]
build_src_filter = -<*> +<../tools/i2c_bus_scanner.cpp>

; Same demo for 1.3" modules with the SH1106 controller
;   pio run -e oled_sh1106 -t upload
[env:oled_sh1106]
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps =
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit GFX Library@^1.12.1
