; esp32-oled firmware (ESP32 DevKit V1 + 128x64 I2C OLED)
;
;   pio run -e hw_sh1106 -t upload    the app, for our 1.3" SH1106 module (default)
;   pio run -e hw_ssd1306 -t upload   the app, for 0.96" SSD1306 modules
;   pio run -e demo_sh1106 -t upload  the "Hello, ESP32!" demo (tools/oled_demo.cpp)
;   pio run -e scanner -t upload      the I2C bus scanner    (tools/i2c_bus_scanner.cpp)
;   pio device monitor                serial monitor
;
; The app reads firmware/firmware.env (git-ignored) at build time; see
; scripts/gen_config.py. The demo and the scanner need no settings.

[platformio]
default_envs = hw_sh1106

[env]
platform = espressif32@7.0.1  ; arduino-esp32 2.0.17 (ESP-IDF 4.4)
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; The app: Wi-Fi, HTTPS registration, MQTT over wss, pairing QR, eyes.
[app]
extra_scripts = pre:scripts/gen_config.py
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    bblanchon/ArduinoJson@^7.4.2

[env:hw_sh1106]
extends = app
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps =
    ${app.lib_deps}
    adafruit/Adafruit SH110X@^2.1.11

[env:hw_ssd1306]
extends = app
lib_deps =
    ${app.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.13

; Standalone tools with their own setup()/loop(), kept outside src/.
; -<*> drops everything in src/, then the one tool file is added back in.
[env:demo_sh1106]
build_src_filter = -<*> +<../tools/oled_demo.cpp>
build_flags = ${env.build_flags} -DUSE_SH1106
lib_deps =
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit GFX Library@^1.12.1

[env:demo_ssd1306]
build_src_filter = -<*> +<../tools/oled_demo.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1

[env:scanner]
build_src_filter = -<*> +<../tools/i2c_bus_scanner.cpp>
