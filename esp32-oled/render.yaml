# Render Blueprint: https://render.com/docs/blueprint-spec
# Lives in esp32-oled/, so set "Blueprint Path" to esp32-oled/render.yaml
# when creating the Blueprint. Paths below are still relative to the repo
# root (Embedded/), as Render resolves them.
#
# esp32-oled-api: the Node backend with Mosquitto inside the same container.
# Phones use HTTPS + /api/live; devices use wss://<host>/mqtt.
# The frontend static site is added here in step 5.

services:
  - type: web
    name: esp32-oled-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: esp32-oled/backend
    dockerfilePath: ./esp32-oled/backend/Dockerfile
    dockerContext: ./esp32-oled/backend
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLEANUP_TZ
        value: Asia/Kolkata
      - key: MONGODB_DB
        value: oled
      - key: IDLE_RELEASE_MIN
        value: "10"
      - key: MAX_DEVICES
        value: "20"
      # The frontend's address (pairing QR links point here). Update it
      # once the static site exists in step 5.
      - key: CORS_ORIGIN
        value: https://esp32-oled-web.onrender.com

      # Asked for once, when the Blueprint is created.
      - key: MONGODB_URI
        sync: false

      # Random 256-bit values, generated by Render on first deploy. Copy
      # PROVISION_KEY into firmware/firmware.env, and ADMIN_KEY for curl.
      # Changing SECRETS_KEY later means every board must register again.
      - key: PROVISION_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: MQTT_ADMIN_PASSWORD
        generateValue: true
      - key: MQTT_BACKEND_PASSWORD
        generateValue: true
