# Render Blueprint: https://render.com/docs/blueprint-spec
# Lives in esp32-oled/, so set "Blueprint Path" to esp32-oled/render.yaml
# when creating the Blueprint. Paths are relative to the repo root
# (Embedded/), except a Docker service's dockerfilePath and dockerContext,
# which Render resolves inside its rootDir.
#
# esp32-oled-api: the Node backend with Mosquitto inside the same container.
#   Phones use HTTPS + /api/live; devices use wss://<host>/mqtt.
# esp32-oled-web: the Vite + React frontend as a static site.
# Each service is told the other's public address. (fromService's `host`
# is the private-network name, e.g. `esp32-oled-web`, which browsers and
# phones cannot use, so the addresses are written out here.)

services:
  - type: web
    name: esp32-oled-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: esp32-oled/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLEANUP_TZ
        value: Asia/Kolkata
      - key: MONGODB_DB
        value: oled
      - key: IDLE_RELEASE_MIN
        value: "10"
      - key: MAX_DEVICES
        value: "20"
      # The frontend's host: CORS, and where pairing QR links point.
      - key: CORS_ORIGIN
        value: https://esp32-oled-web.onrender.com

      # Asked for once, when the Blueprint is created.
      - key: MONGODB_URI
        sync: false

      # Random 256-bit values, generated by Render on first deploy. Copy
      # PROVISION_KEY into firmware/firmware.env, and ADMIN_KEY for curl.
      # Changing SECRETS_KEY later means every board must register again.
      - key: PROVISION_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: MQTT_ADMIN_PASSWORD
        generateValue: true
      - key: MQTT_BACKEND_PASSWORD
        generateValue: true

  - type: web
    name: esp32-oled-web
    runtime: static
    # Run from the repo root; buildFilter limits rebuilds to frontend changes.
    buildCommand: cd esp32-oled/frontend && npm ci && npm run build
    staticPublishPath: ./esp32-oled/frontend/dist
    buildFilter:
      paths:
        - esp32-oled/frontend/**
    autoDeployTrigger: commit
    # React Router handles /pair/<code> and the rest in the browser.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Baked into the bundle at build time (public, never a secret).
      - key: VITE_API_URL
        value: https://esp32-oled-api.onrender.com
